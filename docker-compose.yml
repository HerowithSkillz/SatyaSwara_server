version: '3.8'

services:
  aivoice-api:
    build: .
    container_name: aivoice_detection
    ports:
      - "8000:8000"
    environment:
      - API_KEY=sk_live_ai_voice_detect_2026_xKp9Qm3R
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
